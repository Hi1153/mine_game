<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090b10">
<title>JAPAN RUSH</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#090b10;color:#f7f8fb;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Hiragino Sans",sans-serif}
.app{max-width:620px;margin:auto;min-height:100vh;padding-bottom:30px}
header{padding:22px 18px 14px;border-bottom:1px solid #1d212b;background:#090b10;position:sticky;top:0;z-index:5}
.logo{font-size:25px;font-weight:900;letter-spacing:1px}.logo i{font-style:normal;color:#58d68d}.meta{display:flex;justify-content:space-between;color:#8991a1;font-size:12px;margin-top:5px}
.screen{padding:16px}.start{text-align:center;padding-top:35px}.start .mark{font-size:62px;margin-bottom:8px}.start h1{font-size:34px;margin:0;letter-spacing:-1px}.start p{color:#8f97a6;line-height:1.7}.mainbtn{border:0;background:#58d68d;color:#07100b;border-radius:15px;padding:15px 28px;font-weight:900;font-size:16px;margin-top:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.stat{background:#11141b;border:1px solid #202530;border-radius:13px;padding:10px;text-align:center}.stat small{display:block;color:#7f8796;font-size:10px}.stat b{font-size:19px}
.question{background:#11141b;border:1px solid #202530;border-radius:18px;padding:17px;margin-bottom:12px}.qtop{display:flex;justify-content:space-between;color:#8c94a3;font-size:12px}.q{font-size:21px;font-weight:800;margin:13px 0}.timer{height:4px;background:#252a34;border-radius:5px;overflow:hidden}.timer span{display:block;height:100%;width:100%;background:#58d68d;transform-origin:left}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:9px}.ans{border:1px solid #262b35;background:#12161d;color:#f5f6f8;border-radius:14px;padding:15px 10px;font-weight:750;font-size:15px;min-height:55px}.ans.correct{background:#143b27;border-color:#58d68d}.ans.wrong{background:#3a191d;border-color:#e26d78}
.map{background:#0d1016;border:1px solid #202530;border-radius:18px;padding:10px;margin-top:12px}.maptitle{text-align:center;color:#737c8c;font-size:11px;margin-bottom:8px}.regions{display:grid;gap:6px}.region{display:grid;grid-template-columns:52px repeat(7,1fr);gap:4px;min-height:34px}.regionname{display:flex;align-items:center;color:#697282;font-size:10px}.cell{border:1px solid #252b35;background:#151922;border-radius:6px;color:#cfd4dc;font-size:9px;padding:3px 1px}.cell.active{border-color:#58d68d;color:#58d68d}.cell.done{background:#173324;color:#76e5a0;border-color:#285c40}
.hidden{display:none}.result{text-align:center;padding:40px 10px}.result h2{font-size:30px;margin:10px}.scorebig{font-size:56px;font-weight:950}.line{color:#8e96a5;margin:8px}
button{cursor:pointer}
</style>
</head>
<body>
<div class="app">
<header><div class="logo">JAPAN <i>RUSH</i></div><div class="meta"><span>47 PREFECTURES</span><span id="best">BEST —</span></div></header>

<section id="home" class="screen start">
<div class="mark">🗾</div>
<h1>日本全国を駆け抜けろ。</h1>
<p>60秒で何都道府県わかる？<br>正解するほどコンボ倍率アップ。</p>
<button class="mainbtn" onclick="startGame()">GAME START</button>
</section>

<section id="game" class="screen hidden">
<div class="stats"><div class="stat"><small>SCORE</small><b id="score">0</b></div><div class="stat"><small>COMBO</small><b id="combo">0</b></div><div class="stat"><small>TIME</small><b id="time">60</b></div></div>
<div class="question">
<div class="qtop"><span id="count">1 / ∞</span><span id="region">—</span></div>
<div class="q" id="question">—</div><div class="timer"><span id="bar"></span></div>
</div>
<div class="answers" id="answers"></div>
<div class="map"><div class="maptitle">PREFECTURE BOARD</div><div class="regions" id="board"></div></div>
</section>

<section id="result" class="screen hidden result">
<div class="mark">🏁</div><h2>TIME UP</h2><div class="scorebig" id="finalScore">0</div><div class="line" id="finalLine"></div><button class="mainbtn" onclick="startGame()">もう一度</button>
</section>
</div>
<script>
const data={
"北海道":["北海道"],"東北":["青森県","岩手県","宮城県","秋田県","山形県","福島県"],
"関東":["茨城県","栃木県","群馬県","埼玉県","千葉県","東京都","神奈川県"],
"中部":["新潟県","富山県","石川県","福井県","山梨県","長野県","岐阜県","静岡県","愛知県"],
"近畿":["三重県","滋賀県","京都府","大阪府","兵庫県","奈良県","和歌山県"],
"中国":["鳥取県","島根県","岡山県","広島県","山口県"],
"四国":["徳島県","香川県","愛媛県","高知県"],
"九州":["福岡県","佐賀県","長崎県","熊本県","大分県","宮崎県","鹿児島県","沖縄県"]
};
const all=Object.values(data).flat(), region={};for(const [r,ps] of Object.entries(data))ps.forEach(p=>region[p]=r);
let score=0,combo=0,answered=0,current=null,timer=null,end=0,locked=false;
let audioCtx=null;
function sound(type){
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended') audioCtx.resume();
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.connect(g);g.connect(audioCtx.destination);
    const now=audioCtx.currentTime;
    if(type==='ok'){
      o.frequency.setValueAtTime(660,now);o.frequency.setValueAtTime(880,now+.08);
      g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(.12,now+.01);g.gain.exponentialRampToValueAtTime(.0001,now+.18);
      o.start(now);o.stop(now+.2);
    }else if(type==='bad'){
      o.frequency.setValueAtTime(180,now);o.frequency.setValueAtTime(120,now+.12);
      g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(.1,now+.01);g.gain.exponentialRampToValueAtTime(.0001,now+.25);
      o.start(now);o.stop(now+.27);
    }else if(type==='start'){
      o.frequency.setValueAtTime(440,now);o.frequency.setValueAtTime(660,now+.1);
      g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(.1,now+.01);g.gain.exponentialRampToValueAtTime(.0001,now+.22);
      o.start(now);o.stop(now+.24);
    }else{
      o.frequency.setValueAtTime(523,now);o.frequency.setValueAtTime(784,now+.12);o.frequency.setValueAtTime(1046,now+.24);
      g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(.12,now+.01);g.gain.exponentialRampToValueAtTime(.0001,now+.45);
      o.start(now);o.stop(now+.47);
    }
  }catch(e){}
}
const $=id=>document.getElementById(id);
function buildBoard(){let h='';for(const [r,ps] of Object.entries(data)){h+=`<div class="region"><div class="regionname">${r}</div>`;for(let i=0;i<7;i++)h+=ps[i]?`<div class="cell" id="c-${ps[i]}">${ps[i].replace('県','').replace('府','')}</div>`:'<div></div>';h+='</div>'}$('board').innerHTML=h}
function startGame(){sound('start');clearInterval(timer);score=0;combo=0;answered=0;locked=false;$('home').classList.add('hidden');$('result').classList.add('hidden');$('game').classList.remove('hidden');document.querySelectorAll('.cell').forEach(x=>x.classList.remove('done'));buildBoard();next();end=Date.now()+60000;timer=setInterval(()=>{let left=Math.max(0,end-Date.now());$('time').textContent=Math.ceil(left/1000);if(left<=0)finish()},100)}
function next(){
 locked=false;current=all[Math.floor(Math.random()*all.length)];let other=all.filter(p=>region[p]!==region[current]);
let opts=[current];
while(opts.length<4){
  let p=other[Math.floor(Math.random()*other.length)];
  if(!opts.includes(p))opts.push(p);
}
opts.sort(()=>Math.random()-.5);
 $('question').textContent='「'+region[current]+'」の都道府県は？';$('region').textContent='JAPAN';$('count').textContent=(answered+1)+' / ∞';$('answers').innerHTML=opts.map(p=>`<button class="ans" onclick="answer('${p.replace(/'/g,"\\'")}',this)">${p}</button>`).join('');
 $('bar').style.transition='none';$('bar').style.transform='scaleX(1)';
requestAnimationFrame(()=>{requestAnimationFrame(()=>{
  $('bar').style.transition='transform 4s linear';
  $('bar').style.transform='scaleX(0)';
  $('bar').addEventListener('transitionend',()=>{if(!locked)timeoutAnswer()},{once:true});
})})
}
function answer(p,btn){if(locked)return;locked=true;let ok=p===current;document.querySelectorAll('.ans').forEach(b=>b.disabled=true);if(ok){sound('ok');combo++;score+=100+Math.min(combo,10)*20;btn.classList.add('correct');$('combo').textContent=combo;$('score').textContent=score;$('c-'+current)?.classList.add('done')}else{sound('bad');combo=0;btn.classList.add('wrong');document.querySelectorAll('.ans').forEach(b=>{if(b.textContent===current)b.classList.add('correct')});$('combo').textContent=0}answered++;setTimeout(next,ok?350:700)}
function timeoutAnswer(){if(locked)return;locked=true;sound('bad');combo=0;$('combo').textContent=0;document.querySelectorAll('.ans').forEach(b=>b.disabled=true);document.querySelectorAll('.ans').forEach(b=>{if(b.textContent===current)b.classList.add('correct')});answered++;setTimeout(next,500)}
function finish(){sound('finish');clearInterval(timer);$('game').classList.add('hidden');$('result').classList.remove('hidden');$('finalScore').textContent=score;$('finalLine').textContent=answered+'問挑戦　・　正解 '+document.querySelectorAll('.done').length+'問';let best=Number(localStorage.jpBest||0);if(score>best){localStorage.jpBest=score;best=score;$('finalLine').textContent+='　NEW BEST!'}$('best').textContent='BEST '+best}
buildBoard();$('best').textContent='BEST '+(Number(localStorage.jpBest||0)||'—');
</script>
</body>
</html>
